[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-data-scraper"
version = "0.1.0"
description = "A web data scraper."
authors = [
  { name="Onehand Coding", email="onehand.coding433@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "beautifulsoup4>=4.10.0",
  "requests>=2.25.0",
  "selenium>=4.0.0",
  "typer>=0.4.0",
  "PyYAML>=6.0",
  "Flask>=2.0.0",
  "pandas>=1.3.0",
  "jsonschema>=4.0.0",
  "lxml>=4.6.0",
  "streamlit>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
web-scraper-cli = "web_data_scraper.interfaces.cli:app"
web-scraper-web = "web_data_scraper.interfaces.streamlit_ui.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_data_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
