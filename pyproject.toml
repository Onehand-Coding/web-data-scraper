[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-data-scraper"
version = "0.1.0"
description = "A web data scraper."
authors = [
  { name="Onehand Coding", email="onehand.coding433@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "beautifulsoup4>=4.10.0",
  "requests>=2.25.0",
  "selenium>=4.0.0",
  "typer>=0.4.0",
  "PyYAML>=6.0",
  "Flask>=2.0.0",
  "pandas>=1.3.0",
  "jsonschema>=4.0.0",
  "lxml>=4.6.0",
  "streamlit>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-mock>=3.14.1",
  "ruff>=0.6"
]

[tool.hatch.build.targets.wheel]
packages = ["src/web_data_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[project.scripts]
web-scraper-cli = "web_data_scraper.interfaces.cli:app"
web-scraper-web = "web_data_scraper.interfaces.streamlit_ui.launcher:main"
